name: Temporary TanStack Start security upgrade

on:
  push:
    branches:
      - fix/stripe-checkout-fallback

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/stripe-checkout-fallback

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Upgrade patched TanStack Start
        run: npm install @tanstack/react-start@1.168.60 --save-exact

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: upgrade TanStack Start security patch"
            git push origin HEAD:fix/stripe-checkout-fallback
          fi
