name: INKSIGHTS Sandbox

on:
  pull_request:
    paths:
      - 'sandbox/inksights-sandbox/**'
      - '.github/workflows/inksights-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify sandbox
        working-directory: sandbox/inksights-sandbox
        env:
          APP_ENV: sandbox
        run: |
          node --version
          npm test
          npm run check
          npm run check:phase2
