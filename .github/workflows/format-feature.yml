name: Format feature branch

on:
  push:
    branches:
      - feat/website-rebuild-v1

permissions:
  contents: write

concurrency:
  group: format-feature
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Format tracked source files
        run: npx prettier --write "src/**/*.{ts,tsx,css}" "scripts/**/*.mjs" "supabase/**/*.ts"

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts supabase
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "chore: format feature branch"
            git push
          fi
