name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint.log
          exit 1

      - name: Build and generate route types
        run: npm run build

      - name: Enforce generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > typecheck.log 2>&1

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Test Supabase client config fallback
        run: node --test tests/supabase-config.test.mjs

      - name: Test server routing source of truth
        run: node --test tests/server-routing-source-of-truth.test.mjs

      - name: Test search intelligence authorization policy
        run: node --test supabase/functions/search-intelligence-v1/auth_policy_test.mjs

      - name: Test public pricing validation and idempotency policy
        run: node --test tests/pricing-submission-policy.test.mjs

      - name: Test canonical scoring schema guardrails
        run: node --test tests/studio-scoring-schema.test.mjs

      - name: Typecheck authenticated studio tool claim function
        run: deno check supabase/functions/studio-claim-tool-submission/index.ts

      - name: Test visibility scorecard validation and idempotency
        run: node --test tests/visibility-scorecard-policy.test.mjs

      - name: Test Revenue Audit preview CORS policy
        run: node --test supabase/functions/revenue-audit-v1/cors_policy_test.mjs

      - name: Test Edge Function security boundaries
        run: deno test --allow-net=false supabase/functions/studio-visibility-report-v2/security_test.ts

  scoring-sql-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scoring_qa_only
          POSTGRES_DB: scoring_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoring_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: scoring_qa_only
      PGDATABASE: scoring_qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare synthetic pre-existing schema
        run: psql -v ON_ERROR_STOP=1 -f tests/studio-scoring-postgres-fixture.sql
      - name: Execute the new scoring migration in disposable PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261101060000_public_verified_studio_scoring_v1.sql
      - name: Verify permissions, missing-evidence scores and cross-studio isolation
        run: psql -v ON_ERROR_STOP=1 -f tests/studio-scoring-staging-acceptance.sql

