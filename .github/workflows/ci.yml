name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint.log
          exit 1

      - name: Build and generate route types
        run: npm run build

      - name: Enforce generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > typecheck.log 2>&1

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Test Supabase client config fallback
        run: node --test tests/supabase-config.test.mjs

      - name: Test server routing source of truth
        run: node --test tests/server-routing-source-of-truth.test.mjs

      - name: Test search intelligence authorization policy
        run: node --test supabase/functions/search-intelligence-v1/auth_policy_test.mjs

      - name: Test Revenue Audit preview CORS policy
        run: node --test supabase/functions/revenue-audit-v1/cors_policy_test.mjs

      - name: Test Edge Function security boundaries
        run: deno test --allow-net=false supabase/functions/studio-visibility-report-v2/security_test.ts
