name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint.log
          exit 1

      - name: Test intelligence engine
        id: intelligence_tests
        continue-on-error: true
        run: npm run test:intelligence > intelligence-test.log 2>&1

      - name: Upload intelligence test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-test-diagnostics
          path: intelligence-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce intelligence tests
        if: steps.intelligence_tests.outcome == 'failure'
        run: |
          cat intelligence-test.log
          exit 1

      - name: Build and generate route types
        run: npm run build

      - name: Check generated route tree
        id: route_tree
        continue-on-error: true
        run: git diff --exit-code -- src/routeTree.gen.ts > route-tree.diff

      - name: Upload generated route tree diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-tree-diagnostics
          path: route-tree.diff
          if-no-files-found: error
          retention-days: 7

      - name: Enforce generated route tree is committed
        if: steps.route_tree.outcome == 'failure'
        run: |
          cat route-tree.diff
          exit 1

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > typecheck.log 2>&1

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Test social migration package
        run: python -m unittest discover -s automation/social/tests -p "test_*.py"
