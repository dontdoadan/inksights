name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Repair lockfile on recovery branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/public-report-security-source-parity'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          cp /tmp/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile"
          git push origin "HEAD:$HEAD_REF"

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint.log
          exit 1

      - name: Build and generate route types
        run: npm run build

      - name: Enforce generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > typecheck.log 2>&1

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Test Supabase client config fallback
        run: node --test tests/supabase-config.test.mjs

      - name: Test Calculation Engine V2
        run: npm run test:calc-v2

      - name: Test social migration package
        run: python -m unittest discover -s automation/social/tests -p "test_*.py"

      - name: Test Edge Function security boundaries
        run: deno test --allow-net=false supabase/functions/studio-visibility-report-v2/security_test.ts
