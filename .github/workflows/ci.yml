name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint.log
          exit 1

      - name: Build and generate route types
        run: npm run build

      - name: Commit generated Golden Audit route tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/golden-audit-e2e'
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/routeTree.gen.ts
            git commit -m 'chore: commit generated Golden Audit routes'
            git push origin HEAD:feat/golden-audit-e2e
          fi

      - name: Enforce generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > typecheck.log 2>&1

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce typecheck
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Test Supabase client config fallback
        run: node --test tests/supabase-config.test.mjs

      - name: Test server routing source of truth
        run: node --test tests/server-routing-source-of-truth.test.mjs

      - name: Test Golden Audit schema contract
        run: node --test tests/golden-audit-schema.test.mjs

      - name: Test Golden Audit transaction, quality, evidence and diagnosis logic
        run: deno test --allow-net=false supabase/functions/_shared/audit/*_test.ts

      - name: Test Golden Audit ingestion security
        run: deno test --allow-net=false supabase/functions/golden-audit-ingest/security_test.ts

      - name: Test Golden Audit orchestration state machine
        run: deno test --allow-net=false supabase/functions/golden-audit-run/orchestrator_test.ts

      - name: Test search intelligence authorization policy
        run: node --test supabase/functions/search-intelligence-v1/auth_policy_test.mjs

      - name: Test Revenue Audit preview CORS policy
        run: node --test supabase/functions/revenue-audit-v1/cors_policy_test.mjs

      - name: Test Edge Function security boundaries
        run: deno test --allow-net=false supabase/functions/studio-visibility-report-v2/security_test.ts
