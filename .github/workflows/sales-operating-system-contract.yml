name: Sales Operating System Contract Tests

on:
  pull_request:
    paths:
      - 'src/lib/sales-ops/**'
      - 'tests/sales-ops.test.mjs'
      - 'tests/sql/sales-payment-*.sql'
      - 'tests/sql/sales-identity-*.sql'
      - 'docs/engineering/sales-operating-system-v1.proposed.sql'
      - 'docs/engineering/sales-payment-state-v1.proposed.sql'
      - 'supabase/functions/stripe-checkout-webhook-v1/**'
      - 'supabase/functions/hubspot-sync-v1/**'
      - 'src/routes/api/public/stripe-webhook.ts'
      - '.github/workflows/sales-operating-system-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-contract:
    name: Identity, consent, attribution and payment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sales-ops.test.mjs

  postgres-payment:
    name: Postgres 17 atomic checkout and RLS regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_ops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: sales_ops_ci
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create minimal service role / canonical orders schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sales-payment-bootstrap.sql
      - name: Apply staged payment-state SQL proposal
        run: psql -X -v ON_ERROR_STOP=1 -f docs/engineering/sales-payment-state-v1.proposed.sql
      - name: Verify stale webhook, replay, waiver and access invariants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sales-payment-state-regression.sql
      - name: Create isolated studio, candidate and report references
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sales-identity-bootstrap.sql
      - name: Stage additive sales identity schema
        run: psql -X -v ON_ERROR_STOP=1 -f docs/engineering/sales-operating-system-v1.proposed.sql
      - name: Verify site identity, order links, event dedupe and privilege boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sales-identity-regression.sql
